name: Build GiDuDesk Intel macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag/version
        required: true
        default: v1.0.3
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUSTDESK_REF: "d40e1da715fa1694ff4712f394b81a6df6bcd612"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$VERSION_INPUT"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::Invalid release version/tag: $tag"
            exit 1
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid macOS app version: $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out release repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: release-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Check out RustDesk source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.RUSTDESK_REF }}
          path: rustdesk
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Apply current local RustDesk changes
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/release-repo/.github/patches/rustdesk-local-changes.patch"
          git -C rustdesk apply --unidiff-zero --check "$patch"
          git -C rustdesk apply --unidiff-zero "$patch"

      - name: Set GiDuDesk macOS display name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one target in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          common = Path("rustdesk/flutter/lib/common.dart")
          replace_once(
              common,
              """String getWindowName({WindowType? overrideType}) {
            final name = bind.mainGetAppNameSync();""",
              """String getWindowName({WindowType? overrideType}) {
            final appName = bind.mainGetAppNameSync();
            final name =
                (isWindows || isMacOS) && appName == 'RustDesk' ? 'GiDuDesk' : appName;""",
          )

          plist = Path("rustdesk/flutter/macos/Runner/Info.plist")
          replace_once(
              plist,
              "\t<key>CFBundleDevelopmentRegion</key>\n\t<string>$(DEVELOPMENT_LANGUAGE)</string>",
              "\t<key>CFBundleDevelopmentRegion</key>\n\t<string>$(DEVELOPMENT_LANGUAGE)</string>\n\t<key>CFBundleDisplayName</key>\n\t<string>GiDuDesk</string>",
          )
          replace_once(
              plist,
              "\t<key>CFBundleName</key>\n\t<string>$(PRODUCT_NAME)</string>",
              "\t<key>CFBundleName</key>\n\t<string>GiDuDesk</string>",
          )

          menu = Path("rustdesk/flutter/macos/Runner/Base.lproj/MainMenu.xib")
          text = menu.read_text(encoding="utf-8")
          if "APP_NAME" not in text:
              raise SystemExit(f"Expected APP_NAME tokens in {menu}")
          menu.write_text(text.replace("APP_NAME", "GiDuDesk"), encoding="utf-8")
          PY

      - name: Set GiDuDesk bundle and executable name
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one target in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              Path("flutter/macos/Runner/Configs/AppInfo.xcconfig"),
              "PRODUCT_NAME = RustDesk",
              "PRODUCT_NAME = GiDuDesk",
          )
          project = Path("flutter/macos/Runner.xcodeproj/project.pbxproj")
          text = project.read_text(encoding="utf-8")
          if text.count("RustDesk.app") != 3:
              raise SystemExit(f"Expected three RustDesk.app references in {project}")
          project.write_text(text.replace("RustDesk.app", "GiDuDesk.app"), encoding="utf-8")
          scheme = Path("flutter/macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme")
          text = scheme.read_text(encoding="utf-8")
          if text.count('BuildableName = "RustDesk.app"') != 4:
              raise SystemExit(f"Expected four RustDesk.app buildable names in {scheme}")
          scheme.write_text(text.replace("RustDesk.app", "GiDuDesk.app"), encoding="utf-8")
          replace_once(Path("Cargo.toml"), 'name = "RustDesk"', 'name = "GiDuDesk"')
          PY

      - name: Install macOS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm gnu-sed
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          fi

          curl -fsSLO https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo install -m 755 nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Configure Flutter for CocoaPods
        run: flutter config --no-enable-swift-package-manager

      - name: Patch Flutter framework
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' \
            "$flutter_root/packages/flutter/lib/src/scheduler/binding.dart"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.81"
          targets: x86_64-apple-darwin
          components: rustfmt

      - name: Patch RustDesk sources for Flutter 3.44
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Flutter bridge tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Resolve Flutter dependencies and generate bridge
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          (
            cd flutter
            flutter pub get
          )
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Set macOS deployment target
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          min_macos_version="10.15"
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${min_macos_version}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \".*\"/osx_minimum_system_version = \"${min_macos_version}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = .*;/MACOSX_DEPLOYMENT_TARGET = ${min_macos_version};/" \
            flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${min_macos_version}" >> "$GITHUB_ENV"

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg and install native dependencies
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          export VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT_ID"
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-osx \
            --x-install-root="$VCPKG_ROOT/installed"
          echo "VCPKGRS_TRIPLET=x64-osx" >> "$GITHUB_ENV"
          for header in libavutil/attributes.h libavcodec/avcodec.h; do
            if [[ ! -f "$VCPKG_ROOT/installed/x64-osx/include/$header" ]]; then
              echo "::error::Missing FFmpeg header $header; check the macOS ffmpeg vcpkg dependency."
              exit 1
            fi
          done

      - name: Resolve Cargo features
        id: features
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          features="$(python3 ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit --print-features)"
          echo "list=$features" >> "$GITHUB_OUTPUT"

      - name: Build Rust core
        shell: bash
        working-directory: rustdesk
        env:
          CARGO_FEATURES: ${{ steps.features.outputs.list }}
        run: |
          set -euo pipefail
          MACOSX_DEPLOYMENT_TARGET=10.15 cargo build --locked --target x86_64-apple-darwin --features "$CARGO_FEATURES" --release

      - name: Generate macOS app icon from configured source
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          iconset="flutter/macos/Runner/AppIcon.iconset"
          mkdir -p "$iconset"
          while read -r size name; do
            sips -z "$size" "$size" res/mac-icon.png --out "$iconset/$name.png" >/dev/null
          done <<'ICONS'
          16 icon_16x16
          32 icon_16x16@2x
          32 icon_32x32
          64 icon_32x32@2x
          128 icon_128x128
          256 icon_128x128@2x
          256 icon_256x256
          512 icon_256x256@2x
          512 icon_512x512
          1024 icon_512x512@2x
          ICONS
          iconutil -c icns "$iconset" -o flutter/macos/Runner/AppIcon.icns
          rm -rf "$iconset"
      - name: Build Flutter macOS app
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          (
            cd flutter
            FLUTTER_XCODE_ARCHS=x86_64 \
              FLUTTER_XCODE_ONLY_ACTIVE_ARCH=YES \
              flutter build macos --release --build-name="${{ steps.release.outputs.version }}"
          )
          app="flutter/build/macos/Build/Products/Release/GiDuDesk.app"
          test -d "$app"
          cp target/x86_64-apple-darwin/release/service "$app/Contents/MacOS/"

      - name: Package macOS app
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          app="rustdesk/flutter/build/macos/Build/Products/Release/GiDuDesk.app"
          test -f "$app/Contents/Info.plist"
          test -f "$app/Contents/MacOS/service"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test "$executable" = "GiDuDesk"
          file "$app/Contents/MacOS/$executable" | grep -q 'x86_64'
          archive="GiDuDesk-${RELEASE_TAG}-macos-x86_64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$GITHUB_WORKSPACE/$archive"
          test -s "$GITHUB_WORKSPACE/$archive"
          echo "zip=$archive" >> "$GITHUB_OUTPUT"

      - name: Save macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiDuDesk-macos-${{ steps.release.outputs.tag }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish macOS release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GiDuDesk macOS $RELEASE_TAG (Intel x86_64)" \
              --notes "Intel x86_64 build for Macs running macOS 10.15 or newer." \
              --latest=false
          fi